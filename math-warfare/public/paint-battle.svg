<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" shape-rendering="crispEdges" role="img" aria-labelledby="title desc">
<title id="title">Math Warfare MS Paint battle scene</title>
<desc id="desc">A simple colorful MS Paint style scene made from basic shapes, solid fills, black outlines, a calculator fighter and a math boss.</desc>

<!-- sky + grass, like a basic school MS Paint scenery drawing -->
<rect width="960" height="540" fill="#87CEEB"/>
<rect y="395" width="960" height="145" fill="#73D216"/>
<rect y="395" width="960" height="6" fill="#000000"/>

<!-- sun -->
<circle cx="98" cy="91" r="45" fill="#FFFF00" stroke="#000000" stroke-width="5"/>
<g stroke="#000000" stroke-width="5">
  <line x1="98" y1="20" x2="98" y2="0"/>
  <line x1="98" y1="162" x2="98" y2="183"/>
  <line x1="27" y1="91" x2="3" y2="91"/>
  <line x1="169" y1="91" x2="193" y2="91"/>
  <line x1="48" y1="41" x2="30" y2="23"/>
  <line x1="148" y1="141" x2="166" y2="159"/>
  <line x1="148" y1="41" x2="166" y2="23"/>
  <line x1="48" y1="141" x2="30" y2="159"/>
</g>

<!-- clouds built from circles/rectangles -->
<g fill="#FFFFFF" stroke="#000000" stroke-width="4">
  <circle cx="282" cy="84" r="28"/>
  <circle cx="316" cy="71" r="38"/>
  <circle cx="357" cy="87" r="31"/>
  <rect x="274" y="85" width="95" height="31"/>
  <circle cx="731" cy="72" r="24"/>
  <circle cx="763" cy="58" r="34"/>
  <circle cx="800" cy="75" r="27"/>
  <rect x="724" y="75" width="88" height="28"/>
</g>

<!-- simple hills -->
<polygon points="0,395 170,215 325,395" fill="#B97A57" stroke="#000000" stroke-width="5"/>
<polygon points="185,395 390,185 575,395" fill="#A67C52" stroke="#000000" stroke-width="5"/>
<polygon points="620,395 795,235 960,395" fill="#B97A57" stroke="#000000" stroke-width="5"/>

<!-- title -->
<rect x="286" y="18" width="390" height="58" fill="#FFFF00" stroke="#000000" stroke-width="5"/>
<text x="481" y="58" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="34" fill="#000000">MATH WARFARE</text>

<!-- calculator fighter -->
<rect x="115" y="247" width="192" height="210" fill="#00B7FF" stroke="#000000" stroke-width="6"/>
<rect x="141" y="269" width="140" height="55" fill="#E6FF8A" stroke="#000000" stroke-width="5"/>
<text x="211" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#000000">7 × 8</text>

<!-- calculator buttons -->
<g stroke="#000000" stroke-width="4">
  <rect x="144" y="342" width="34" height="32" fill="#FFFFFF"/>
  <rect x="188" y="342" width="34" height="32" fill="#FFFFFF"/>
  <rect x="232" y="342" width="34" height="32" fill="#FF5757"/>
  <rect x="144" y="383" width="34" height="32" fill="#FFFF00"/>
  <rect x="188" y="383" width="34" height="32" fill="#FFFFFF"/>
  <rect x="232" y="383" width="34" height="32" fill="#00FF00"/>
</g>
<g font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#000000" text-anchor="middle">
  <text x="161" y="366">7</text>
  <text x="205" y="366">8</text>
  <text x="249" y="366">×</text>
  <text x="161" y="407">4</text>
  <text x="205" y="407">5</text>
  <text x="249" y="407">=</text>
</g>

<!-- calculator stick arms/legs -->
<g stroke="#000000" stroke-width="7" fill="none">
  <line x1="115" y1="334" x2="70" y2="300"/>
  <line x1="70" y1="300" x2="45" y2="319"/>
  <line x1="307" y1="334" x2="348" y2="294"/>
  <line x1="348" y1="294" x2="376" y2="307"/>
  <line x1="165" y1="457" x2="145" y2="505"/>
  <line x1="257" y1="457" x2="276" y2="505"/>
  <line x1="119" y1="505" x2="164" y2="505"/>
  <line x1="257" y1="505" x2="303" y2="505"/>
</g>

<!-- tiny flag -->
<line x1="45" y1="319" x2="45" y2="243" stroke="#000000" stroke-width="5"/>
<polygon points="45,243 102,257 45,276" fill="#FF0000" stroke="#000000" stroke-width="4"/>

<!-- math boss: simple red square monster -->
<rect x="650" y="252" width="205" height="190" fill="#FF3B30" stroke="#000000" stroke-width="6"/>
<polygon points="650,252 681,218 711,252" fill="#FF3B30" stroke="#000000" stroke-width="5"/>
<polygon points="793,252 824,218 855,252" fill="#FF3B30" stroke="#000000" stroke-width="5"/>
<rect x="682" y="284" width="46" height="42" fill="#FFFFFF" stroke="#000000" stroke-width="5"/>
<rect x="777" y="284" width="46" height="42" fill="#FFFFFF" stroke="#000000" stroke-width="5"/>
<circle cx="705" cy="305" r="9" fill="#000000"/>
<circle cx="800" cy="305" r="9" fill="#000000"/>
<rect x="691" y="348" width="126" height="50" fill="#FFFFFF" stroke="#000000" stroke-width="5"/>
<text x="754" y="383" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="29" fill="#000000">12 × 8</text>

<!-- boss arms/legs -->
<g stroke="#000000" stroke-width="7" fill="none">
  <line x1="650" y1="347" x2="608" y2="320"/>
  <line x1="855" y1="347" x2="897" y2="321"/>
  <line x1="697" y1="442" x2="679" y2="497"/>
  <line x1="811" y1="442" x2="827" y2="497"/>
</g>

<!-- flying answer / projectile -->
<line x1="380" y1="309" x2="572" y2="309" stroke="#000000" stroke-width="5"/>
<polygon points="572,309 548,296 548,322" fill="#000000"/>
<circle cx="484" cy="309" r="38" fill="#FFFF00" stroke="#000000" stroke-width="5"/>
<text x="484" y="320" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="31" fill="#000000">56</text>

<!-- explosion -->
<polygon points="560,214 583,229 606,210 613,238 642,235 630,261 654,278 625,286 628,315 601,303 585,328 571,301 542,309 549,280 524,265 551,250 543,222" fill="#FFFF00" stroke="#000000" stroke-width="5"/>
<text x="589" y="272" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="22" fill="#FF0000">BAM!</text>

<!-- very simple flowers, another common Paint-school-project motif -->
<g stroke="#000000" stroke-width="3">
  <circle cx="410" cy="456" r="10" fill="#FF00FF"/>
  <circle cx="394" cy="456" r="10" fill="#FF00FF"/>
  <circle cx="402" cy="442" r="10" fill="#FF00FF"/>
  <circle cx="402" cy="470" r="10" fill="#FF00FF"/>
  <circle cx="402" cy="456" r="8" fill="#FFFF00"/>
  <line x1="402" y1="478" x2="402" y2="520" stroke="#008000" stroke-width="5"/>

  <circle cx="538" cy="462" r="10" fill="#FFFFFF"/>
  <circle cx="522" cy="462" r="10" fill="#FFFFFF"/>
  <circle cx="530" cy="448" r="10" fill="#FFFFFF"/>
  <circle cx="530" cy="476" r="10" fill="#FFFFFF"/>
  <circle cx="530" cy="462" r="8" fill="#FFFF00"/>
  <line x1="530" y1="484" x2="530" y2="520" stroke="#008000" stroke-width="5"/>
</g>
</svg>